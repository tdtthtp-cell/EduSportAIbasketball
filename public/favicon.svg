<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Basketball Gradient -->
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="55%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Outer Emerald Ring -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Basketball with Shadow -->
  <g filter="url(#softGlow)">
    <!-- Basketball Body -->
    <circle cx="64" cy="65" r="42" fill="url(#ballGrad)" stroke="#7c2d12" stroke-width="1.5" />

    <!-- Basketball Seam Lines (Crisp geometric curves) -->
    <!-- Vertical Seam -->
    <path d="M 64 23 C 50 42, 50 88, 64 107" fill="none" stroke="#291206" stroke-width="2.8" stroke-linecap="round" />
    <!-- Opposite Vertical Seam Reflection -->
    <path d="M 64 23 C 78 42, 78 88, 64 107" fill="none" stroke="#291206" stroke-width="2.8" stroke-linecap="round" />
    <!-- Horizontal Center Seam -->
    <line x1="22" y1="65" x2="106" y2="65" stroke="#291206" stroke-width="2.8" stroke-linecap="round" />
    <!-- Central Divider -->
    <line x1="64" y1="23" x2="64" y2="107" stroke="#291206" stroke-width="2.5" stroke-linecap="round" />

    <!-- Ball Specular Highlight -->
    <ellipse cx="50" cy="45" rx="16" ry="8" fill="#ffffff" opacity="0.22" transform="rotate(-30 50 45)" />
  </g>

  <!-- Health Pulse & Graduation / Education Crown Ribbon at Top -->
  <!-- Golden Laurel / Educational Banner at Bottom -->
  <path d="M 36 109 Q 64 118 92 109 Q 82 117 64 117 Q 46 117 36 109 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Top Badge: Golden Star + Health Cross / Whistle -->
  <g filter="url(#softGlow)">
    <!-- Shield Top Mini Badge -->
    <circle cx="64" cy="18" r="10" fill="#047857" stroke="#34d399" stroke-width="1.8" />
    <!-- Medical / Health Heart Pulse or Star -->
    <path d="M 64 12 L 66 16 L 70 17 L 67 20 L 68 24 L 64 22 L 60 24 L 61 20 L 58 17 L 62 16 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Subtle HTP text badge tag -->
  <text x="64" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2" opacity="0.95">
    HTP • SPORT
  </text>
</svg>
